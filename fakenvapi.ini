; Vulkanized-Fakenvapi 0.9.0 VulkanFlex R3 configuration
;
; Architecture:
; OBSERVE MANY INPUTS -> FREEZE ONE SOURCE PER SEMANTIC ASPECT
; -> DRIVE EXACTLY ONE OUTPUT BACKEND.
;
; VulkanFlex is Vulkan-only. Its portable baseline uses core WSI acquire/present
; observations plus the embedded LatencyFleX scheduler. Vendor APIs remain
; optional higher-quality inputs/capabilities, not requirements.

[general]
; off | info | trace
logging=info
allow_fallback=1
runtime_switching=1

[input]
; auto | reflex | vk_nv_low_latency2 | xell | antilag2
mode=auto
priority=reflex,xell,antilag2,vk_nv_low_latency2
minimum_quality=60

[output]
; auto or an explicit backend supported by the graphics API
; d3d11: antilag2 | latencyflex
; d3d12: amd_anti_lag | antilag2 | xell | latencyflex
; vulkan: vulkanflex | amd_anti_lag | latencyflex
;
; Use vulkan=vulkanflex only for targeted testing. In auto mode a real native
; VK_NV_low_latency2 implementation remains authoritative when native
; extensions are preferred.
d3d11=auto
d3d12=auto
vulkan=auto

[backend_order]
d3d11=antilag2,vulkanflex,latencyflex
d3d12=antilag2,xell,latencyflex
vulkan=vulkanflex,amd_anti_lag,latencyflex

[hybrid]
; HybridFusion is an information/provenance layer, never a second scheduler.
; One source is frozen for each semantic aspect during startup. Runtime owner
; switching remains disabled after the startup lock.
xell_fusion=1
vulkan_fusion=1
startup_locked=1
startup_observations=64
aspect_minimum_quality=60

; Compatibility aliases. Parsed for old configurations but do not re-enable
; runtime aspect-owner switching.
aspect_adaptive=1
aspect_switch_margin=6
fill_missing_signals=1
secondary_minimum_quality=60

[vulkan]
; off | selective | aggressive
spoofing=selective
; auto | 0 | 1
expose_nv_low_latency2=auto
expose_amd_anti_lag=auto
prefer_native_extensions=1

[vulkanflex]
; Translation-aware Vulkan latency orchestrator.
enabled=1
; Use successful vkAcquireNextImage* as the fallback pacing opportunity when
; no explicit frontend owns pacing.
core_pacing=1
; Native Vulkan WSI detours remain isolated from translation stacks.
only_native_vulkan=1
; Cooperative translation bridges use COM interop and install no Vulkan detours.
vkd3d_bridge=1
dxvk_bridge=1
; auto = delegate to DXVK's own ID3DLowLatencyDevice when supported, otherwise observer only
; 0    = observer only
; 1    = permit embedded VulkanFlex execution only when DXVK's LL API is unavailable
dxvk_execution=auto
present_precision=auto
; R3.7 soft queue-pressure governor. Auto arms only after stable VF2+
; completion evidence and never uses blocking vkWaitForPresent*.
; auto | 0 | 1
queue_pressure=auto
; Desired number of presentation-engine completions allowed to remain pending.
queue_target_presents=1
; Maximum extra delay folded into VulkanFlex's existing single wake target.
queue_max_delay_us=2000
; R4.0 structural-stall shielding. Auto learns a clean completion baseline and
; only compensates a frametime outlier when a long graphics/compute pipeline
; creation call provides corroborating structural evidence.
; auto | 0 | 1
structural_stall=auto
; Pipeline creation must exceed this duration before it can become evidence.
pipeline_threshold_us=2000
; Hard cap on time removed from one estimator sample.
stall_max_compensation_us=50000
; 0 means no VulkanFlex-enforced FPS cap. Explicit frontend minimum intervals
; are still honored when larger.
minimum_interval_us=0
; Hard cap on one scheduler sleep to fail open on pathological predictions.
max_sleep_us=50000

[openxr]
; R4.1 XRFlex observes the standard OpenXR frame loop. xrWaitFrame remains the
; sole XR runtime timing/throttling owner; no additional scheduler sleep is added.
enabled=1
timeline=1
; R4.2 converts each relevant XrTime through the runtime's enabled
; XR_KHR_win32_convert_performance_counter_time function. No cached clock
; offset is used, matching the OpenXR time-domain requirements.
clock_sync=1

[audio]
; R4.5 AudioFlex observes WASAPI and can negotiate a lower period only when
; the application itself uses IAudioClient3::InitializeSharedAudioStream.
; auto = recommendation-only; 1 = opt-in negotiation with original-period fallback.
enabled=1
wasapi_observer=1
clock=1
active_probe=1
queue_model=1
clock_probe_interval_ms=250
adaptive_period=auto
period_target_us=5000
period_max_reduction_percent=50

[overlay]
startup_status=1
duration_ms=4000

; ---------------------------------------------------------------------------
; Legacy 1.x compatibility
; ---------------------------------------------------------------------------
; Existing [fakenvapi] keys are still accepted and translated at runtime.
; Do not add them to a new config unless old 1.x behavior is specifically
; required. When detected they emit a deprecation warning.
